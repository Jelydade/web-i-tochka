<html lang="ru">
<head>

    :root { font-family: Arial, sans-serif; color: #20211f; background: #f7f7f2; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }

    b { color: #304bff; }

  <main>
    <h1>Страница загрузилась <b>сразу.</b></h1>

  </main>
